apiVersion: apps/v1
kind: Deployment
metadata:
  name: poc-spa
  namespace: rhbk-mc
  labels:
    app: poc-spa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: poc-spa
  template:
    metadata:
      labels:
        app: poc-spa
    spec:
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
            - name: html
              mountPath: /usr/share/nginx/html/styles.css
              subPath: styles.css
              readOnly: true
            - name: html
              mountPath: /usr/share/nginx/html/app.mjs
              subPath: app.mjs
              readOnly: true
            - name: html
              mountPath: /usr/share/nginx/html/vendor/keycloak.js
              subPath: keycloak.js
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: html
          configMap:
            name: poc-spa
        - name: nginx-conf
          configMap:
            name: poc-spa-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: poc-spa
  namespace: rhbk-mc
  labels:
    app: poc-spa
spec:
  selector:
    app: poc-spa
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: poc-spa
  namespace: rhbk-mc
  labels:
    app: poc-spa
spec:
  host: poc-spa.apps-crc.testing
  to:
    kind: Service
    name: poc-spa
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
