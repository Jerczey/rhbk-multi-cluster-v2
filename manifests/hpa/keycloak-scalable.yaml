# HPA lab: scalable Keycloak CR (v2beta1) with stateless + metrics.
# Apply after base secrets exist in rhbk-mc. JDBC host uses PRIMARY_HOST from postgres.env at apply time
# or patch db.url to match your Linux host LAN IP.
apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: keycloak
  namespace: rhbk-mc
  labels:
    app: keycloak
    site: site-a
    lab: hpa
spec:
  instances: 2
  image: default-route-openshift-image-registry.apps-crc.testing/rhbk-mc/keycloak:26.7.0-optimized
  startOptimized: true
  hostname:
    hostname: https://auth.lan.local:8443
    strict: false
  http:
    tlsSecret: keycloak-tls-secret
  db:
    vendor: postgres
    url: jdbc:postgresql://192.168.122.1:5432/keycloak
    poolMinSize: 5
    poolInitialSize: 5
    poolMaxSize: 15
    usernameSecret:
      name: keycloak-db-secret
      key: username
    passwordSecret:
      name: keycloak-db-secret
      key: password
  features:
    enabled:
      - stateless
  additionalOptions:
    - name: spi-cache-embedded--default--cluster-name
      value: cluster-a
    - name: log-console-output
      value: json
    - name: metrics-enabled
      value: "true"
    - name: db-tls-mode
      value: disabled
  ingress:
    enabled: true
    annotations:
      haproxy.router.openshift.io/balance: roundrobin
      haproxy.router.openshift.io/disable_cookies: "true"
  resources:
    requests:
      cpu: "500m"
      memory: "768Mi"
    limits:
      cpu: "2"
      memory: "1536Mi"
