apiVersion: v1
kind: Namespace
metadata:
  name: rhbk-mc
  labels:
    app.kubernetes.io/part-of: rhbk-multi-cluster-v2
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: rhbk-mc-og
  namespace: rhbk-mc
spec:
  targetNamespaces:
    - rhbk-mc
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: keycloak-operator
  namespace: rhbk-mc
spec:
  channel: fast
  name: keycloak-operator
  source: community-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
