global
  log stdout format raw local0
  maxconn 2048

defaults
  log global
  mode http
  option httplog
  timeout connect 5s
  timeout client  60s
  timeout server  60s
  timeout check   5s

frontend keycloak_front
  bind *:8443 ssl crt /etc/haproxy/certs/keycloak.pem
  default_backend keycloak_sites

backend keycloak_sites
  balance roundrobin
  option httpchk GET /lb-check
  http-check expect string UP
  # Both sites share public hostname auth.lan.local; CRC routers match SNI/Host per cluster
  server site_a host.containers.internal:443 ssl verify none sni str(auth.lan.local) check check-ssl check-sni auth.lan.local inter 5s fall 3 rise 2
  server site_b 192.168.0.102:443 ssl verify none sni str(auth.lan.local) check check-ssl check-sni auth.lan.local inter 5s fall 3 rise 2
