server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    absolute_redirect off;

    # Same-origin health proxy (matches Express /api/lb-check for local npm start)
    location = /api/lb-check {
        proxy_pass https://192.168.0.114:8443/lb-check;
        proxy_ssl_server_name on;
        proxy_ssl_name auth.lan.local;
        proxy_ssl_verify off;
        proxy_set_header Host auth.lan.local;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
