listen_addresses = '*'
port = 5432
wal_level = replica
max_wal_senders = 10
max_replication_slots = 10
hot_standby = on
synchronous_commit = on
# Require sync only when Site B standby is streaming (see scripts/enable-sync-replication.sh).
# Empty default avoids blocking COMMIT when standby is down (Site A solo / HPA lab).
synchronous_standby_names = ''
wal_keep_size = 1GB
password_encryption = scram-sha-256
